[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actual-updater"
version = "0.1.0"
description = "Mixed Python/TypeScript application for importing Israeli bank transactions into Actual Budget"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    "nicegui==3.11.0",
    "authlib==1.7.0",
    "uvicorn[standard]==0.46.0",
    "cryptography==47.0.0",
    "keyring==25.7.0",
    "keyrings.alt==5.0.2",
]

[project.optional-dependencies]
dev = [
    "black==26.3.1",
    "pylint==4.0.5",
    "coverage==7.13.5",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "selenium==4.43.0",
    "playwright==1.58.0",
]

# Essential for making src/ modules importable
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*"]

# VS Code Black configuration
[tool.black]
line-length = 120
target-version = ['py311']

# VS Code Pylint configuration  
[tool.pylint.format]
max-line-length = 120

# Test coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "coverage"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
main_file = ""
